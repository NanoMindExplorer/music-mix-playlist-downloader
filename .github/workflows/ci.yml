# GitHub Actions CI untuk mmpd
# Auto-run tests di setiap push & PR ke main
# Test matrix: Python 3.9, 3.10, 3.11, 3.12, 3.13, 3.14
# Termux compatibility: Python 3.14 (latest Termux default)

name: CI

on:
  push:
    branches: [main, "fase*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Lanjut test versi lain walau satu gagal
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # Test di macOS juga untuk Python 3.12 (cross-platform verification)
          - python-version: "3.12"
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify syntax (all files compile)
        run: |
          python -m py_compile downloader.py
          python -m py_compile mmpd/*.py
          python -m py_compile mmpd/utils/*.py
          python -m py_compile mmpd/modes/*.py

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ -v --cov=mmpd --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov (Python 3.12 only)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false  # Don't fail build if codecov upload fails

      - name: Run mypy type check
        run: |
          python -m mypy mmpd/ --ignore-missing-imports || true  # Non-blocking for now
        continue-on-error: true

      - name: Run ruff lint
        run: |
          python -m ruff check mmpd/ || true  # Non-blocking for now
        continue-on-error: true

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test  # Only build if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel installable
        run: |
          pip install dist/*.whl
          mmpd --version
          mmpd doctor || true  # Non-blocking (no Spotify creds in CI)
          pip uninstall -y music-mix-playlist-downloader

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmpd-wheel
          path: dist/*.whl
          retention-days: 30

  smoke-test-termux:
    """
    Smoke test untuk memastikan package bisa di-install dan dijalankan
    dengan environment mirip Termux (Python 3.14, no GUI).
    """
    name: Termux Smoke Test (Python 3.14)
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system deps (FFmpeg, Git)
        run: |
          apt-get update
          apt-get install -y ffmpeg git

      - name: Install mmpd
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify imports work
        run: |
          python -c "import mmpd; print(f'mmpd version: {mmpd.__version__}')"
          python -c "import downloader; print('downloader OK')"
          python -m mmpd --version

      - name: Run doctor
        run: mmpd doctor || true  # Non-blocking (network might fail in container)
        continue-on-error: true

      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -v --tb=short
