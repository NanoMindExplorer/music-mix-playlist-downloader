[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-mix-playlist-downloader"
version = "3.3.0"
description = "CLI Next-Gen untuk download YouTube Mix, Playlist Spotify, SoundCloud dengan AI Lyrics Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "NanoMindExplorer", email = "nanomindexplorer@users.noreply.github.com" }
]
keywords = [
    "youtube-downloader",
    "spotify-downloader",
    "soundcloud-downloader",
    "lyrics",
    "lrc",
    "transliteration",
    "audio-converter",
    "termux",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Android",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "yt-dlp>=2023.11.16",
    "rich>=13.0.0",
    "mutagen>=1.47.0",
    "questionary>=2.0.1",
    "syncedlyrics>=1.0.1",
    "pykakasi>=2.3.0",
    "pypinyin>=0.51.0",
    "langdetect>=1.0.9",
    "korean_romanizer>=0.28.0",
    "anyascii>=0.3.3",
    "deep-translator>=1.11.4",
    "rapidfuzz>=3.0.0",
    "requests>=2.31.0",
    # Fase 2.3: Spotify official API (Client Credentials flow, no user auth)
    # Optional secara teknis (legacy scraping masih jalan), tapi very recommended
    # untuk ISRC matching (akurasi 99%+ vs fuzzy title matching)
    "spotipy>=2.23.0",
]

[project.optional-dependencies]
# Dependencies untuk development & testing
dev = [
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "types-requests>=2.31.0",
]
# Fase 2.3: spotipy sekarang di dependencies utama (di atas), bukan optional.
# Optional: LRCLIB provider (sudah pakai requests, tapi explicit untuk clarity)
lrclib = [
    "requests>=2.31.0",
]

[project.scripts]
# Entry point: setelah `pip install .`, user bisa langsung jalankan `mmpd`
mmpd = "downloader:main"

[project.urls]
Homepage = "https://github.com/NanoMindExplorer/music-mix-playlist-downloader"
Repository = "https://github.com/NanoMindExplorer/music-mix-playlist-downloader"
Issues = "https://github.com/NanoMindExplorer/music-mix-playlist-downloader/issues"
Changelog = "https://github.com/NanoMindExplorer/music-mix-playlist-downloader/releases"

[tool.setuptools]
# Package discovery: include mmpd/ + mmpd/utils/ + mmpd/modes/ + flat modules
py-modules = ["downloader", "spotify_parser"]
packages = ["mmpd", "mmpd.utils", "mmpd.modes"]

[tool.setuptools.package-data]
mmpd = ["py.typed"]
"mmpd.utils" = ["py.typed"]
"mmpd.modes" = ["py.typed"]

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # progressive: false until all funcs typed
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "yt_dlp.*",
    "syncedlyrics.*",
    "pykakasi.*",
    "pypinyin.*",
    "korean_romanizer.*",
    "langdetect.*",
    "anyascii.*",
    "deep_translator.*",
    "rapidfuzz.*",
    "questionary.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (rich output is wide)
    "B008",  # function call in default argument (questionary style)
]
